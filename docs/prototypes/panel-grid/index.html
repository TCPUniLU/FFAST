<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel grid prototype</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #121417; --surface: #1a1d21; --surface-2: #22262b; --surface-3: #2c3137;
    --line: #3a4047; --ink: #f2f3f5; --ink-2: #c3c8cf; --ink-3: #9aa1ab;
    --accent: #56b4e9; --accent-ink: #0b1a24; --sel: rgba(86, 180, 233, 0.18);
    --warn: #e69f00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink-2);
         font: 13px/1.4 system-ui, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 12px;
         background: var(--surface); border-bottom: 1px solid var(--line); }
  #bar label { display: flex; gap: 6px; align-items: center; color: var(--ink-3); }
  select, button { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
                   border-radius: 4px; padding: 3px 8px; font: inherit; }
  button:hover { background: var(--surface-3); }
  #note { display: none; padding: 8px 12px; color: var(--warn); }
  #page { padding: 12px; }
  #grid { position: relative; }
  #grid.dragging.edit {
    background-image:
      repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--col-pitch)),
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--row-pitch));
    background-size: 100% 100%;
    background-blend-mode: normal;
    opacity: 1;
  }
  .panel { position: absolute; background: var(--surface); border: 1px solid var(--line);
           border-radius: 4px; display: flex; flex-direction: column; overflow: hidden;
           transition: left .12s, top .12s, width .12s, height .12s; }
  .panel.active { transition: none; opacity: .5; }
  .title { padding: 4px 8px; background: var(--surface-2); color: var(--ink);
           border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; user-select: none; }
  .edit .title { cursor: grab; }
  .body { flex: 1; background: #2a2e33; display: grid; place-items: center; color: var(--ink-3);
          min-height: 0; }
  .panel.k3d .body { background: #07090b; }
  .ghost { position: absolute; border: 2px dashed var(--accent); background: var(--sel);
           border-radius: 4px; pointer-events: none; z-index: 5; }
  .h { position: absolute; z-index: 3; display: none; }
  .edit .h { display: block; }
  .edit.corner-only .h.e, .edit.corner-only .h.s { display: none; }
  .h.e { top: 0; right: 0; width: 8px; height: 100%; cursor: ew-resize; }
  .h.s { left: 0; bottom: 0; height: 8px; width: 100%; cursor: ns-resize; }
  .h.e:hover, .h.s:hover { background: var(--accent); opacity: .6; }
  .h.c { right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; color: var(--ink-3);
         text-align: right; line-height: 18px; font-size: 14px; padding-right: 2px; z-index: 4; }
  .h.c:hover { color: var(--accent); }
  #grid.narrow .panel { position: static; margin-bottom: 8px; height: 200px !important;
                        width: auto !important; transition: none; }
  pre { margin: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--line);
        border-radius: 4px; color: var(--ink-2); overflow: auto; }
</style>
</head>
<body>
<div id="bar">
  <label>Columns <select id="cols"><option>12</option><option>24</option></select></label>
  <label>Row unit <select id="unit"><option value="50">50 px</option><option value="100">100 px</option></select></label>
  <label>Handles <select id="handles"><option value="both">edges + corner</option><option value="corner">corner only</option></select></label>
  <label>Compaction <select id="compact"><option value="on">on</option><option value="off">off</option></select></label>
  <button id="reset">Reset</button>
</div>
<div id="note">Too narrow to edit; widen the window.</div>
<div id="page"><div id="grid" class="edit"></div></div>
<pre id="saved"></pre>

<script>
(function () {
  var GAP = 8, NARROW = 800;
  // Start layout is written for 12 columns, 50 px units.
  var START = [
    { id: 'a', title: '3D panel', kind: '3d', x: 0, y: 0, w: 6, h: 8 },
    { id: 'b', title: 'Energy MAE distribution', kind: 'density', x: 6, y: 0, w: 6, h: 6 },
    { id: 'c', title: 'Forces RMSE timeline', kind: 'timeline', x: 6, y: 6, w: 6, h: 6 },
    { id: 'd', title: 'Energy MAE / RMSE tables', kind: 'table', x: 0, y: 8, w: 6, h: 4 }
  ];
  var cols = 12, unit = 50, handles = 'both', compaction = true;
  var panels = clone(START);
  var drag = null;
  var gridEl = document.getElementById('grid');
  var els = {};

  function clone(a) { return a.map(function (p) { return Object.assign({}, p); }); }
  function minSize(p) { var f = cols / 12; return p.kind === '3d' ? { w: 4 * f, h: 6 * (50 / unit) } : { w: 3 * f, h: 4 * (50 / unit) }; }
  function minW(p) { return Math.ceil(minSize(p).w); }
  function minH(p) { return Math.ceil(minSize(p).h); }
  function overlap(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function order(a, b) { return a.y - b.y || a.x - b.x; }

  /** Push overlapping panels down, just below the other one, until nothing overlaps. */
  function resolve(list, activeId) {
    for (var guard = 0; guard < 500; guard++) {
      var moved = false;
      for (var i = 0; i < list.length && !moved; i++) {
        for (var j = i + 1; j < list.length && !moved; j++) {
          var a = list[i], b = list[j];
          if (!overlap(a, b)) continue;
          var stay, go;
          if (a.id === activeId) { stay = a; go = b; }
          else if (b.id === activeId) { stay = b; go = a; }
          else { var s = [a, b].sort(order); stay = s[0]; go = s[1]; }
          go.y = stay.y + stay.h;
          moved = true;
        }
      }
      if (!moved) return;
    }
  }

  /** Move every panel up as far as it goes without overlapping, in order of y then x. */
  function compact(list) {
    var placed = [];
    list.slice().sort(order).forEach(function (p) {
      while (p.y > 0) {
        p.y -= 1;
        if (placed.some(function (q) { return overlap(p, q); })) { p.y += 1; break; }
      }
      placed.push(p);
    });
  }

  function settle(activeId) {
    resolve(panels, activeId);
    if (compaction) compact(panels);
  }

  function metrics() {
    var width = gridEl.clientWidth;
    var colW = (width - GAP * (cols - 1)) / cols;
    return { colW: colW, colPitch: colW + GAP, rowPitch: unit + GAP };
  }
  function rect(p, m) {
    return { left: p.x * m.colPitch, top: p.y * m.rowPitch,
             width: p.w * m.colPitch - GAP, height: p.h * m.rowPitch - GAP };
  }
  function isNarrow() { return document.getElementById('page').clientWidth + 24 < NARROW; }

  function build() {
    gridEl.innerHTML = '';
    els = {};
    panels.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'panel k' + p.kind;
      el.innerHTML = '<div class="title"></div><div class="body"></div>' +
        '<div class="h e"></div><div class="h s"></div><div class="h c">◢</div>';
      el.querySelector('.title').textContent = p.title;
      el.querySelector('.body').textContent = p.kind;
      gridEl.appendChild(el);
      els[p.id] = el;
      wire(el, p.id);
    });
  }

  function render() {
    var narrow = isNarrow();
    gridEl.classList.toggle('narrow', narrow);
    gridEl.classList.toggle('edit', !narrow);
    gridEl.classList.toggle('corner-only', handles === 'corner');
    document.getElementById('note').style.display = narrow ? 'block' : 'none';
    var m = metrics();
    gridEl.style.setProperty('--col-pitch', m.colPitch + 'px');
    gridEl.style.setProperty('--row-pitch', m.rowPitch + 'px');
    var sorted = panels.slice().sort(order);
    var bottom = 0;
    sorted.forEach(function (p) {
      var el = els[p.id];
      bottom = Math.max(bottom, p.y + p.h);
      if (narrow) { el.style.cssText = ''; gridEl.appendChild(el); return; }
      var r = rect(p, m);
      el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
      el.style.width = r.width + 'px'; el.style.height = r.height + 'px';
    });
    gridEl.style.height = narrow ? 'auto' : ((bottom + 2) * m.rowPitch) + 'px';
    saved();
  }

  function saved() {
    var w = Math.max.apply(null, panels.map(function (p) { return p.title.length; }));
    var lines = ['columns = ' + cols + ', row_unit = ' + unit];
    panels.slice().sort(order).forEach(function (p) {
      lines.push(p.title + new Array(w - p.title.length + 3).join(' ') +
        'x=' + p.x + ' y=' + p.y + ' w=' + p.w + ' h=' + p.h);
    });
    document.getElementById('saved').textContent = lines.join('\n');
  }

  function showGhost(r) {
    var g = gridEl.querySelector('.ghost');
    if (!g) { g = document.createElement('div'); g.className = 'ghost'; gridEl.appendChild(g); }
    g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  }
  function clearGhost() { var g = gridEl.querySelector('.ghost'); if (g) g.remove(); }

  /** One pointer gesture: 'move' (title bar), 'e', 's' or 'c' (resize). */
  function wire(el, id) {
    function start(mode) {
      return function (ev) {
        if (isNarrow()) return;
        ev.preventDefault();
        var p = panels.filter(function (q) { return q.id === id; })[0];
        el.setPointerCapture(ev.pointerId);
        drag = { id: id, mode: mode, sx: ev.clientX, sy: ev.clientY, orig: Object.assign({}, p),
                 pid: ev.pointerId, next: Object.assign({}, p) };
        gridEl.classList.add('dragging');
        el.classList.add('active');
      };
    }
    el.querySelector('.title').addEventListener('pointerdown', start('move'));
    el.querySelector('.h.e').addEventListener('pointerdown', start('e'));
    el.querySelector('.h.s').addEventListener('pointerdown', start('s'));
    el.querySelector('.h.c').addEventListener('pointerdown', start('c'));
    el.addEventListener('pointermove', function (ev) {
      if (!drag || drag.id !== id || ev.pointerId !== drag.pid) return;
      var m = metrics(), o = drag.orig, p = drag.next;
      var dc = (ev.clientX - drag.sx) / m.colPitch, dr = (ev.clientY - drag.sy) / m.rowPitch;
      if (drag.mode === 'move') {
        p.x = Math.min(cols - o.w, Math.max(0, Math.round(o.x + dc)));
        p.y = Math.max(0, Math.round(o.y + dr));
      } else {
        if (drag.mode !== 's') p.w = Math.min(cols - o.x, Math.max(minW(o), Math.round(o.w + dc)));
        if (drag.mode !== 'e') p.h = Math.max(minH(o), Math.round(o.h + dr));
      }
      showGhost(rect(p, m));
    });
    function end(ev) {
      if (!drag || drag.id !== id || ev.pointerId !== drag.pid) return;
      var p = panels.filter(function (q) { return q.id === id; })[0];
      if (ev.type === 'pointerup') Object.assign(p, drag.next);
      drag = null;
      el.classList.remove('active');
      gridEl.classList.remove('dragging');
      clearGhost();
      settle(id);
      render();
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  function setCols(n) {
    var f = n / cols;
    panels.forEach(function (p) {
      p.x = Math.round(p.x * f); p.w = Math.max(1, Math.round(p.w * f));
    });
    cols = n;
    panels.forEach(function (p) { p.w = Math.max(p.w, minW(p)); p.w = Math.min(p.w, cols); p.x = Math.min(p.x, cols - p.w); });
    settle(null);
  }
  function setUnit(n) {
    var f = unit / n; // keep pixels: old units * old size = new units * new size
    unit = n;
    panels.forEach(function (p) {
      p.y = Math.round(p.y * f); p.h = Math.max(minH(p), Math.round(p.h * f));
    });
    settle(null);
  }

  document.getElementById('cols').onchange = function (e) { setCols(+e.target.value); render(); };
  document.getElementById('unit').onchange = function (e) { setUnit(+e.target.value); render(); };
  document.getElementById('handles').onchange = function (e) { handles = e.target.value; render(); };
  document.getElementById('compact').onchange = function (e) { compaction = e.target.value === 'on'; settle(null); render(); };
  document.getElementById('reset').onclick = function () {
    cols = 12; unit = 50; handles = 'both'; compaction = true; panels = clone(START);
    document.getElementById('cols').value = '12'; document.getElementById('unit').value = '50';
    document.getElementById('handles').value = 'both'; document.getElementById('compact').value = 'on';
    render();
  };
  window.addEventListener('resize', render);

  build();
  render();
})();
</script>
</body>
</html>
