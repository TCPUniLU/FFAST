[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffast"
version = "2.0.0"
requires-python = ">=3.11,<3.14"
# Headless core: ffast-server + ffast-cli. No Qt/GUI (see ADR 0026).
dependencies = [
    "ase>=3.26.0",
    "numpy>=2.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "msgpack>=1.0.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "jaxtyping>=0.2.34",
    "threadpoolctl>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Server plugins (ADR 0048): each ML-backend model loader in
# ffast/plugins/models/ pulls its own heavy framework, gated behind its own
# extra so a base install stays slim. torch itself is already a base
# dependency above. A backend's module still imports cleanly with its extra
# absent — the real dependency is lazily imported inside the loader's
# __init__/predict — so the plugin registers fine either way; a missing
# backend only surfaces when a user actually loads a model of that type.
mace = ["mace-torch"]
nequip = ["nequip"]
schnetpack = ["schnetpack"]
sgdml = ["sgdml"]
# spookynet has no PyPI distribution (vendor ships it as source only, see
# https://github.com/OUnke/SpookyNet) — no extra to declare; install it
# manually per the vendor's own instructions if needed.
# playwright drives the browser-client runtime tests. Without it declared,
# `pip install -e ".[dev]"` produced an environment that could not even
# collect the suite. pytest-xdist runs the tests in parallel (`addopts` below).
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.0", "playwright>=1.40", "pillow>=10.0"]
zstd = ["zstandard>=0.21"]
# Benchmark harnesses: benchmarks/ingest (ADR 0105) and benchmarks/storage (ADR 0109).
# DuckDB reads and writes the Parquet rows; zarr is a storage candidate, bench only.
bench = ["duckdb>=1.0", "zarr>=3.1,<4"]
# Live LAMMPS watching (ADR 0086): DetectAna scores the frames. Not on PyPI
# yet; installed from its GitHub tag. FFAST needs 0.3.0 or later (the bundle
# API) and is tested with 0.4.0.
# The cluster bootstrap ships a wheel built from a local DetectAna checkout
# if there is one, else from the tag pinned here (cluster/bootstrap.py).
# RDKit finds a reference's bonds over its frames (ffast/live/bonds.py).
live = ["detectana @ git+https://github.com/AntonCh-G/DetectAna.git@v0.4.0", "rdkit>=2023.9"]

[project.scripts]
# `ffast` starts the browser client (ADR 0090, ADR 0098).
ffast = "launcher:main"
ffast-web = "ffast.renderers.web.launcher:main"
ffast-server = "server:cli"
ffast-cli = "ffast.cli.main:main"
# Live LAMMPS runs (ADR 0086): the job-script wrapper and the scorer it starts.
ffast-lammps = "ffast.live.wrapper:main"
ffast-live = "ffast.live.scorer:main"

[tool.setuptools]
py-modules = ["launcher", "server"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ffast",
    "ffast.*",
    "cluster",
    "cluster.*",
]
namespaces = true

[tool.setuptools.package-data]
"ffast.config" = ["*.toml", "builtin_tabs/*.toml", "default.json"]
# Vendored web client assets (ADR 0045): HTML/JS/CSS + vendored Three.js and
# Plotly under static/. These must ship in the wheel or `ffast` (the web
# launcher) serves a dead page. The recursive `static/**/*` glob covers the
# vendor/ and panes/ subdirs (recursive `**` needs the setuptools>=64 we pin).
"ffast.renderers.web" = ["static/**/*"]

[tool.black]
line-length = 79
skip-magic-trailing-comma = 1

[tool.isort]
profile = "black"
line-length = 79

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Six parallel processes (pytest-xdist): the browser tests take about 3 minutes
# instead of 9; more workers measured no faster. `-n 0` runs in one process.
addopts = "-n 6"
markers = [
    "integration: end-to-end tests that spawn a real ffast-server subprocess (deselect with '-m \"not integration\"')",
]
