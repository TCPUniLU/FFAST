[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffast"
version = "2.0.0"
requires-python = "==3.11.*"
# Headless core: ffast-server + ffast-cli. No Qt/GUI (see ADR 0026).
dependencies = [
    "ase>=3.26.0",
    "numpy<2.0.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "msgpack>=1.0.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "jaxtyping>=0.2.34",
]

[project.optional-dependencies]
# Desktop client: `pip install ffast[gui]` adds the Qt/Vispy renderer.
gui = [
    "pyopengl>=3.1.10",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.8,<6.9",
    "qasync>=0.28.0",
    "vispy>=0.16.1",
]
# Server plugins (ADR 0048): each ML-backend model loader in
# ffast/plugins/models/ pulls its own heavy framework, gated behind its own
# extra so a base install stays slim. torch itself is already a base
# dependency above. A backend's module still imports cleanly with its extra
# absent — the real dependency is lazily imported inside the loader's
# __init__/predict — so the plugin registers fine either way; a missing
# backend only surfaces when a user actually loads a model of that type.
mace = ["mace-torch"]
nequip = ["nequip"]
schnetpack = ["schnetpack"]
sgdml = ["sgdml"]
# spookynet has no PyPI distribution (vendor ships it as source only, see
# https://github.com/OUnke/SpookyNet) — no extra to declare; install it
# manually per the vendor's own instructions if needed.
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]
zstd = ["zstandard>=0.21"]

[project.scripts]
# One-command web launcher (ADR 0045): start the server on loopback + open the
# browser. Phase 6 retires the Qt desktop as the default — `ffast` now launches
# the web client, which needs no native GL/Qt libraries and so installs and
# runs reliably on any distro. `ffast-web` stays as an explicit alias.
ffast = "ffast.renderers.web.launcher:main"
ffast-web = "ffast.renderers.web.launcher:main"
# The Qt/Vispy desktop stays reachable as an escape hatch for anyone with a
# working `ffast[gui]` install (`pip install ffast[gui]`).
ffast-qt = "main:cli"
ffast-server = "server:cli"
ffast-cli = "ffast.cli.main:main"

[tool.setuptools]
py-modules = ["events", "main", "server", "tasks", "utils"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ffast",
    "ffast.*",
    "UI",
    "UI.*",
    "client",
    "client.*",
    "cluster",
    "cluster.*",
    "config",
    "config.*",
    "datasetLoaders",
    "datasetLoaders.*",
    "modelLoaders",
    "modelLoaders.*",
    "modules",
    "modules.*",
]
namespaces = true

[tool.setuptools.package-data]
config = ["default.json"]
"ffast.config" = ["*.toml", "builtin_tabs/*.toml"]
# Vendored web client assets (ADR 0045): HTML/JS/CSS + vendored Three.js and
# Plotly under static/. These must ship in the wheel or `ffast` (the web
# launcher) serves a dead page. The recursive `static/**/*` glob covers the
# vendor/ and panes/ subdirs (recursive `**` needs the setuptools>=64 we pin).
"ffast.renderers.web" = ["static/**/*"]

[tool.black]
line-length = 79
skip-magic-trailing-comma = 1

[tool.isort]
profile = "black"
line-length = 79

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that spawn a real ffast-server subprocess (deselect with '-m \"not integration\"')",
]
