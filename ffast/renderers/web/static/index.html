<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFAST Web Viewer</title>
  <style>
    /* palette — mirrors the Qt desktop tokens (config/uiConfig.py BGColor and
       HLColor families, config/default.json loupeBGColor) so the browser reads
       as the same app: Discord-grey surfaces, muted-grey text, teal accent.
       Layout mirrors the Qt shell: object-list rail beside tabbed main content,
       with the 3D Loupe as one tab among the analysis tabs. */
    :root {
      --bg1: #202225;   /* darkest — app base            (@BGColor1) */
      --bg2: #2f3136;   /* panels, inputs                (@BGColor2) */
      --bg3: #36393f;   /* buttons, borders              (@BGColor3) */
      --bg4: #494d55;   /* hover                         (@BGColor4) */
      --bg5: #575b63;   /* active hover                  (@BGColor5) */
      --text1: #b9bbc2; /* default text (grey)           (@TextColor1) */
      --text2: #ffffff; /* active / selected text        (@TextColor2) */
      --text-hover: #dbdde4;                          /* (@TextColorHover) */
      --hl1: #4e747a;   /* muted teal — input underline  (@HLColor1) */
      --hl2: #1ca6bb;   /* vivid teal — accent, active   (@HLColor2) */
      --muted: #8a8d94; /* section / group headers */
      --danger: #dc3545;
      --success: #17a2b8;
      --sel: rgba(28, 166, 187, 0.22);
      /* The Qt QSS declares `font-family: monoespace` — a typo Qt can't resolve,
         so the desktop actually renders in the platform default (San Francisco
         on macOS), a proportional sans. Match that, not monospace. */
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 13px;
      background: var(--bg1);
      color: var(--text1);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* thin scrollbars, matching the Qt QScrollBar 8px track */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg1); }
    ::-webkit-scrollbar-thumb { background: var(--bg4); }
    ::-webkit-scrollbar-thumb:hover { background: var(--hl2); }
    * { scrollbar-width: thin; scrollbar-color: var(--bg4) var(--bg1); }

    /* ── top bar (connection) ────────────────────────────────────────── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg2);
      border-bottom: 1px solid var(--bg3);
      flex-shrink: 0;
    }
    #topbar h1 {
      font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--hl2); margin-right: 6px;
    }
    .connection-field { display: flex; align-items: center; gap: 6px; }
    #topbar label {
      color: var(--muted); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    #topbar input {
      background: var(--bg1); border: none; border-bottom: 2px solid var(--hl1);
      border-radius: 4px 4px 0 0; color: var(--text1);
      padding: 3px 8px; font-family: var(--font); font-size: 12px; width: 160px;
    }
    #topbar input:focus { outline: none; border-bottom-color: var(--hl2); }

    button {
      padding: 4px 10px; border: none; border-radius: 3px;
      background: var(--bg3); color: var(--text1); cursor: pointer;
      font-family: var(--font); font-size: 12px; height: 24px;
    }
    button:hover { background: var(--bg4); color: var(--text-hover); }
    button:active { background: var(--hl2); color: var(--text2); }
    button:disabled {
      color: rgba(139, 141, 148, 0.5); background: transparent;
      box-shadow: inset 0 0 0 2px var(--bg3); cursor: default;
    }

    #status { margin-left: auto; font-size: 11px; color: var(--muted); }
    #status.connected { color: var(--success); }
    #status.error { color: var(--danger); }

    /* ── main layout ─────────────────────────────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── object rail (datasets + predictions) ────────────────────────── */
    #objectbar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--bg3);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 8px;
      gap: 14px;
    }
    .obj-group { display: flex; flex-direction: column; gap: 4px; }
    .obj-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 4px; margin-bottom: 2px; border-bottom: 1px solid var(--bg3);
    }
    .section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
    }
    button.mini {
      width: 22px; height: 20px; padding: 0; font-size: 14px; line-height: 1;
      border-radius: 3px;
    }
    .obj-list { display: flex; flex-direction: column; gap: 2px; }
    .obj-empty { color: var(--muted); font-size: 11px; padding: 4px 6px; font-style: italic; }
    .obj-row {
      display: flex; align-items: baseline; gap: 6px;
      padding: 5px 8px; border-radius: 4px; cursor: pointer;
      border-left: 2px solid transparent;
    }
    .obj-row:hover { background: var(--bg3); }
    .obj-row.selected { background: var(--sel); border-left-color: var(--hl2); }
    .obj-row.disabled { opacity: 0.4; cursor: default; }
    .obj-row.disabled:hover { background: transparent; }
    .obj-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text1); }
    .obj-row.selected .name { color: var(--text2); }
    .obj-row .meta { color: var(--muted); font-size: 10px; flex-shrink: 0; }

    /* ── tabbed content ──────────────────────────────────────────────── */
    #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg1); }
    #tabbar {
      display: flex; align-items: stretch; flex-shrink: 0;
      background: var(--bg1); border-bottom: 1px solid var(--bg3);
      overflow-x: auto;
    }
    .tab {
      padding: 0 16px; height: 30px; display: flex; align-items: center;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); cursor: pointer; white-space: nowrap;
      border-bottom: 2px solid transparent; user-select: none;
    }
    .tab:hover { color: var(--text-hover); border-bottom-color: var(--hl1); }
    .tab.active { color: var(--text2); background: var(--bg2); border-bottom-color: var(--hl2); }

    #tabpanels { flex: 1; position: relative; overflow: hidden; }
    .tabpanel { position: absolute; inset: 0; display: none; flex-direction: column; }
    .tabpanel.active { display: flex; }

    /* placeholder analysis tabs — real plots wired via ADR 0043 */
    .placeholder {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; text-align: center; color: var(--muted); padding: 24px;
    }
    .placeholder .ph-title { color: var(--text1); font-size: 14px; }
    .placeholder .ph-sub { font-size: 11px; max-width: 380px; line-height: 1.6; }

    /* ── pick toolbar + contextual strip (issue 10) ──────────────────── */
    #pick-bar {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 4px 10px; background: var(--bg2); border-bottom: 1px solid var(--bg3);
      min-height: 30px;
    }
    #pick-toolbar { display: flex; gap: 4px; }
    .pick-tool-btn {
      width: 30px; height: 24px; padding: 0; font-size: 13px; line-height: 1;
      background: var(--bg3); border-radius: 3px;
    }
    .pick-tool-btn.active {
      background: var(--hl2); color: var(--text2);
      box-shadow: inset 0 0 0 1px var(--hl2);
    }
    #pick-strip {
      display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text1);
    }
    #pick-strip.hidden { display: none; }
    #pick-strip .pick-sep { color: var(--muted); }
    #pick-strip-tool { color: var(--hl2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    #pick-strip-count { color: var(--text1); }
    #pick-strip-radius { color: var(--muted); }
    #pick-readout { color: var(--text2); font-variant-numeric: tabular-nums; }
    #pick-clear { width: 22px; height: 20px; padding: 0; font-size: 11px; }

    /* rubber-band box while dragging a rectangle pick tool */
    #pick-rect {
      position: absolute; display: none; z-index: 5; pointer-events: none;
      border: 1px solid var(--hl2); background: var(--sel);
    }

    /* ── 3D viewport (inside the Loupe tab) ──────────────────────────── */
    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;   /* Qt loupe default (default.json loupeBGColor) */
    }
    #canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #55585f; pointer-events: none;
    }
    #overlay.hidden { display: none; }
    #overlay .big { font-size: 18px; font-weight: 300; margin-bottom: 6px; }
    #overlay .small { font-size: 11px; }

    /* loupe control strip (Playback + View, MVP subset) */
    #loupe-controls {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 6px 10px; background: var(--bg2); border-top: 1px solid var(--bg3);
    }
    #loupe-controls .ctl-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    #frame-slider { flex: 1; accent-color: var(--hl2); min-width: 80px; }
    #frame-label { font-size: 11px; color: var(--muted); min-width: 64px; text-align: right; }
    #loupe-controls button.icon-btn { width: 26px; padding: 0; font-size: 12px; }
    #loupe-controls input.ctl-number {
      width: 52px; background: var(--bg1); border: 1px solid var(--bg3);
      border-radius: 3px; color: var(--text1); padding: 2px 4px; font-size: 11px;
    }

    /* ── Loupe: viewport column + settings sidebar ──────────────────────── */
    #panel-loupe { flex-direction: row; }
    #viewport-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    #loupe-sidebar {
      width: 250px; flex-shrink: 0;
      background: var(--bg2); border-left: 1px solid var(--bg3);
      overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .pane { background: var(--bg1); border-radius: 4px; overflow: hidden; }
    .pane-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; cursor: pointer; user-select: none;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    .pane-header:hover { color: var(--text-hover); }
    .pane-chevron { transition: transform 0.15s; font-size: 9px; }
    .pane.collapsed .pane-chevron { transform: rotate(-90deg); }
    .pane.collapsed .pane-body { display: none; }
    .pane-body { display: flex; flex-direction: column; gap: 6px; padding: 2px 8px 8px; }

    .ctl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
    .ctl-row label { font-size: 11px; color: var(--text1); flex-shrink: 0; }
    .ctl-row select, .ctl-row input[type="text"], .ctl-row input[type="number"] {
      max-width: 130px; font-size: 11px; height: 22px; padding: 1px 6px;
    }
    .ctl-row input[type="checkbox"] { accent-color: var(--hl2); width: 14px; height: 14px; }
    .ctl-row input[type="color"] {
      width: 32px; height: 20px; padding: 0; border: 1px solid var(--bg3);
      border-radius: 3px; background: transparent; cursor: pointer;
    }
    .ctl-slider-wrap { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
    .ctl-slider-wrap input[type="range"] { flex: 1; max-width: 90px; accent-color: var(--hl2); }
    .ctl-slider-value { font-size: 10px; color: var(--muted); min-width: 26px; text-align: right; }
    .ctl-btn-group { display: flex; gap: 4px; justify-content: center; padding: 2px 0; }
    .ctl-btn-group button { flex: 1; }
    .ctl-row:has(.ctl-textarea) { align-items: flex-start; }
    .ctl-textarea {
      flex: 1; min-height: 48px; resize: vertical; font-family: var(--font);
      font-size: 11px; background: var(--bg2); color: var(--text1);
      border: 1px solid var(--bg3); border-radius: 3px; padding: 4px 6px;
    }
    .ctl-hint { font-size: 10px; color: var(--danger); }
    .ctl-hint.ok { color: var(--success); }

    /* colorbar (issue 03): static gradient + vmin/vmax + label */
    #colorbar {
      display: flex; align-items: center; gap: 6px; padding: 4px 2px;
    }
    #colorbar.hidden { display: none; }
    #colorbar-gradient {
      flex: 1; height: 12px; border-radius: 2px; border: 1px solid var(--bg3);
    }
    #colorbar .cb-min, #colorbar .cb-max { font-size: 9px; color: var(--muted); }
    #colorbar-label { font-size: 10px; color: var(--text1); text-align: center; }

    /* satellite (popped-out) loupe: chrome hidden, viewport fills the window.
       The main tab owns the single WebSocket; this tab renders scenes relayed
       over a BroadcastChannel and sends frame intents back through it. */
    body.loupe-only #objectbar,
    body.loupe-only #tabbar,
    body.loupe-only #popout-btn,
    body.loupe-only .connection-field,
    body.loupe-only #connect-btn,
    body.loupe-only #disconnect-btn,
    body.loupe-only #loupe-sidebar,
    body.loupe-only #pick-bar,
    body.loupe-only #prev-frame-btn,
    body.loupe-only #play-pause-btn,
    body.loupe-only #next-frame-btn,
    body.loupe-only #fps-input,
    body.loupe-only #skip-input { display: none; }

    @media (max-width: 720px) {
      #main { flex-direction: column; }
      #objectbar { width: 100%; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--bg3); }
      #topbar { flex-wrap: wrap; }
      #topbar input { width: auto; min-width: 0; flex: 1 1 auto; }
    }

    /* ── file browser modal ──────────────────────────────────────────── */
    #fb-modal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    #fb-modal.hidden { display: none; }
    #fb-panel {
      width: 640px; max-width: 92vw; height: 70vh; max-height: 600px;
      background: var(--bg2); border: 1px solid var(--bg3); border-radius: 6px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    #fb-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-bottom: 1px solid var(--bg3); flex-shrink: 0;
    }
    #fb-header .title {
      font-size: 12px; font-weight: 700; color: var(--hl2); margin-right: 4px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    #fb-path {
      flex: 1; font-family: var(--font); font-size: 11px;
      color: var(--text1); background: var(--bg1); border: 1px solid var(--bg3);
      border-radius: 4px; padding: 3px 6px; overflow-x: auto; white-space: nowrap;
    }
    #fb-list { flex: 1; overflow-y: auto; padding: 4px; }
    .fb-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
      user-select: none;
    }
    .fb-row:hover { background: var(--bg3); }
    .fb-row.selected { background: var(--sel); }
    .fb-row .icon { width: 16px; text-align: center; flex-shrink: 0; }
    .fb-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-row .size { color: var(--muted); font-size: 10px; flex-shrink: 0; }
    .fb-row.dir .name { color: var(--text1); }
    .fb-row.file .name { color: #9a9ca3; }
    #fb-error { color: var(--danger); font-size: 11px; padding: 8px 12px; }
    #fb-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-top: 1px solid var(--bg3); flex-shrink: 0;
    }
    #fb-footer label {
      font-size: 10px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    #fb-footer .spacer { flex: 1; }
    select {
      background: var(--bg2); border: none; border-bottom: 2px solid var(--hl1);
      border-radius: 4px 4px 0 0; color: var(--hl2); padding: 3px 8px;
      font-family: var(--font); font-size: 12px; height: 28px;
    }
    select:focus { outline: none; border-bottom-color: var(--hl2); }
    #fb-type { width: 130px; }
  </style>

  <!-- Three.js is vendored under vendor/three/ (no CDN — the client must work
       offline and on a cluster with no outbound network). The import map
       resolves the bare "three" specifier for both ffast-viewer.js and
       OrbitControls.js's own internal `from 'three'` import. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js"
    }
  }
  </script>
</head>
<body>

  <div id="topbar">
    <h1>FFAST</h1>
    <div class="connection-field server-field">
      <label for="ws-url">Server</label>
      <input id="ws-url" type="text" value="ws://localhost:8765" placeholder="ws://host:port">
    </div>
    <div class="connection-field token-field">
      <label for="token-input">Token</label>
      <input id="token-input" type="text" placeholder="(optional)" style="width:120px">
    </div>
    <button id="connect-btn">Connect</button>
    <button id="disconnect-btn" disabled>Disconnect</button>
    <span id="status">Disconnected</span>
  </div>

  <div id="main">
    <!-- object rail: loaded datasets + predictions, mirroring the Qt SideBar -->
    <div id="objectbar">
      <div class="obj-group">
        <div class="obj-head">
          <span class="section-title">Datasets</span>
          <button id="add-dataset-btn" class="mini" title="Load dataset" disabled>+</button>
        </div>
        <div id="dataset-list" class="obj-list">
          <div class="obj-empty">— none loaded —</div>
        </div>
      </div>

      <div class="obj-group">
        <div class="obj-head">
          <span class="section-title">Predictions</span>
          <button id="add-prediction-btn" class="mini" title="Load prediction" disabled>+</button>
        </div>
        <div id="model-list" class="obj-list">
          <div class="obj-empty">— none —</div>
        </div>
      </div>
    </div>

    <!-- tabbed main content: 3D Loupe + analysis tabs -->
    <div id="content">
      <div id="tabbar"></div>
      <div id="tabpanels">
        <div class="tabpanel active" id="panel-loupe">
          <div id="viewport-col">
            <!-- pick toolbar + contextual strip (ADR 0045 Phase 2, issue 10):
                 one armed tool at a time, with its live pick count + read-out -->
            <div id="pick-bar">
              <div id="pick-toolbar"></div>
              <div id="pick-strip" class="hidden">
                <span id="pick-strip-tool"></span>
                <span class="pick-sep">·</span>
                <span id="pick-strip-count"></span>
                <span id="pick-strip-radius"></span>
                <span id="pick-readout"></span>
                <button id="pick-clear" title="Clear picks">✕</button>
              </div>
            </div>
            <div id="viewport">
              <canvas id="canvas"></canvas>
              <div id="overlay">
                <div class="big">No scene loaded</div>
                <div class="small">Connect, load a dataset, then select it to open the view</div>
              </div>
            </div>
            <div id="loupe-controls">
              <button id="prev-frame-btn" class="icon-btn" title="Previous frame" disabled>◀</button>
              <button id="play-pause-btn" class="icon-btn" title="Play/Pause" disabled>▶</button>
              <button id="next-frame-btn" class="icon-btn" title="Next frame" disabled>▶|</button>
              <span class="ctl-label">Frame</span>
              <input id="frame-slider" type="range" min="0" max="0" value="0" step="1" disabled>
              <span id="frame-label">0 / 0</span>
              <span class="ctl-label">FPS</span>
              <input id="fps-input" class="ctl-number" type="number" min="1" max="5000" value="30">
              <span class="ctl-label">Skip</span>
              <input id="skip-input" class="ctl-number" type="number" min="0" max="99999" value="0">
              <button id="reset-camera-btn" disabled>Reset Camera</button>
              <button id="popout-btn" title="Open this 3D view in a new browser tab" disabled>⧉ New Tab</button>
            </div>
          </div>
          <div id="loupe-sidebar"></div>
        </div>
        <!-- analysis tab panels injected by ffast-viewer.js -->
      </div>
    </div>
  </div>

  <!-- ── remote filesystem browser ─────────────────────────────────────── -->
  <div id="fb-modal" class="hidden">
    <div id="fb-panel">
      <div id="fb-header">
        <span class="title" id="fb-title">Load Remote Dataset</span>
        <button id="fb-up" title="Parent directory">↑</button>
        <button id="fb-home" title="Home">⌂</button>
        <input id="fb-path" type="text" readonly value="">
      </div>
      <div id="fb-error" style="display:none"></div>
      <div id="fb-list"></div>
      <div id="fb-footer">
        <span id="fb-dataset-fields">
          <label for="fb-type">Type</label>
          <select id="fb-type">
            <option value="ase (auto)">ase (auto)</option>
            <option value="sGDML">sGDML</option>
          </select>
        </span>
        <span id="fb-prediction-fields" style="display:none; align-items:center; gap:6px;">
          <label for="fb-target-ds">For dataset</label>
          <select id="fb-target-ds" style="width:130px"></select>
          <label for="fb-energy-key">Energy</label>
          <select id="fb-energy-key" style="width:90px"></select>
          <label for="fb-force-key">Force</label>
          <select id="fb-force-key" style="width:90px"></select>
        </span>
        <span class="spacer"></span>
        <button id="fb-cancel">Cancel</button>
        <button id="fb-load" disabled>Load</button>
      </div>
    </div>
  </div>

  <script type="module" src="ffast-viewer.js"></script>
</body>
</html>
