# Basic Errors — energy/force MAE+RMSE distributions, timelines, one table of
# the scalar errors and true-vs-predicted scatter. A tab-level
# energy-shift toggle drives the shared `shifted` compute-param across every
# energy Panel. Fully declarative (ADR 0021); the legacy modules/basicErrors.py
# was retired once this reached parity. Uses the `energy_shift` tab control.
[[tabs]]
name = "Basic Errors"
has_data_selector = true
controls = ["energy_shift"]
# Rows are 300 px; the table row is half of that (a row per dataset and
# prediction, 10 rows before it scrolls).
row_heights = [1, 1, 1, 0.5, 1]

# --- row 0: MAE distributions --------------------------------------------- #
[[tabs.panels]]
kind = "density"
row = 0
col = 0
title = "Energy MAE distribution"
x_label = ["Energy MAE", "energyUnit"]
hidden_params = ["shifted"]
  [tabs.panels.metrics.value]
  metric = "ffast.energy_difference_density"

[[tabs.panels]]
kind = "density"
row = 0
col = 1
title = "Forces MAE distribution"
x_label = ["Forces MAE", "forceUnit"]
  [tabs.panels.metrics.value]
  metric = "ffast.force_mae_per_structure_density"

# --- row 1: MAE timelines -------------------------------------------------- #
[[tabs.panels]]
kind = "timeline"
row = 1
col = 0
title = "Energy MAE timeline"
y_label = ["Energy MAE", "energyUnit"]
hidden_params = ["shifted"]
  [tabs.panels.metrics.y]
  metric = "ffast.energy_error_smoothed"

[[tabs.panels]]
kind = "timeline"
row = 1
col = 1
title = "Forces MAE timeline"
y_label = ["Forces MAE", "forceUnit"]
  [tabs.panels.metrics.y]
  metric = "ffast.force_mae_per_structure_smoothed"

# --- row 2: Forces RMSE distribution + timeline ---------------------------- #
[[tabs.panels]]
kind = "density"
row = 2
col = 0
title = "Forces RMSE distribution"
x_label = ["Forces RMSE", "forceUnit"]
  [tabs.panels.metrics.value]
  metric = "ffast.force_rmse_density"

[[tabs.panels]]
kind = "timeline"
row = 2
col = 1
title = "Forces RMSE timeline"
y_label = ["Forces RMSE", "forceUnit"]
  [tabs.panels.metrics.y]
  metric = "ffast.force_rmse_smoothed"

# --- row 3: one table of the errors: a row per dataset and prediction ------- #
[[tabs.panels]]
kind = "table"
row = 3
col = 0
colspan = 2
title = "Errors"
hidden_params = ["shifted"]
options = { column_labels = ["Energy MAE", "Energy RMSE", "Forces MAE", "Forces RMSE"] }
  [[tabs.panels.metrics.value]]
  metric = "ffast.energy_difference"
  transform = ["shift", "mean_abs"]
  [[tabs.panels.metrics.value]]
  metric = "ffast.energy_difference"
  transform = ["shift", "rmse"]
  [[tabs.panels.metrics.value]]
  metric = "ffast.force_difference[dataset;component;mae]"
  [[tabs.panels.metrics.value]]
  metric = "ffast.force_difference[dataset;component;rmse]"

# --- row 4: true-vs-predicted scatter -------------------------------------- #
# Every structure's energy as a density, the worst as dots (ADR 0078): drawing
# all 1.77M energies of a big shard as dots froze the page (2026-11-13). x and
# y are not drawn: the server reads them to make a subset from a box.
[[tabs.panels]]
kind = "parity"
row = 4
col = 0
title = "Energy Scatter"
diagonal = true
x_label = ["True Energy", "energyUnit"]
y_label = ["Predicted Energy", "energyUnit"]
hidden_params = ["shifted"]
  [tabs.panels.metrics.x]
  metric = "ffast.energy_reference"
  [tabs.panels.metrics.y]
  metric = "ffast.energy_prediction"
  transform = "shift"
  [tabs.panels.metrics.density]
  metric = "ffast.energy_parity_density"
  [tabs.panels.metrics.outliers]
  metric = "ffast.energy_parity_outliers"

# Every force component as a density, the worst as dots (ADR 0078). x and y
# are not drawn: the server reads them to make a subset from a box.
[[tabs.panels]]
kind = "parity"
row = 4
col = 1
title = "Forces Scatter"
diagonal = true
x_label = ["True Forces", "forceUnit"]
y_label = ["Predicted Forces", "forceUnit"]
  [tabs.panels.metrics.x]
  metric = "ffast.force_reference"
  [tabs.panels.metrics.y]
  metric = "ffast.force_prediction"
  [tabs.panels.metrics.density]
  metric = "ffast.force_parity_density"
  [tabs.panels.metrics.outliers]
  metric = "ffast.force_parity_outliers"
