[package]
name = "ffast-xyz"
version = "0.1.0"
edition = "2021"
description = "Fast parser for extended-XYZ files, used by FFAST"
license = "MIT"

[lib]
name = "_ffast_xyz"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
rayon = "1.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
