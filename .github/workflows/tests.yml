name: tests

on:
  push:
    branches: [main, dev, 2ffast]
  pull_request:
  workflow_dispatch:

jobs:
  full:
    name: full suite (core + Qt client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # PySide6 needs these even under the offscreen platform plugin.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install FFAST
        run: pip install -e ".[gui,dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -m "not integration"

  headless:
    name: headless core (no Qt installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # A base install must not need Qt. If anything in the server import
      # closure grows a PySide6 dependency, these two commands break.
      - name: Install FFAST without the gui extra
        run: pip install -e ".[dev]"

      - name: Server and CLI must import and run
        run: |
          python -c "import server, ffast.core.environment"
          ffast-cli metrics validate
          ffast-cli metrics test

      - name: Core boundary tests
        run: pytest -q tests/ffast/test_ffast_core_boundary.py
