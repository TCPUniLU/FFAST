name: tests

on:
  push:
    branches: [main, dev, 2ffast]
  pull_request:
  workflow_dispatch:

jobs:
  full:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The live extra brings DetectAna and RDKit; tests/ffast/live needs both.
      - name: Install FFAST
        run: pip install -e ".[dev,live]"

      # The fast .xyz parser (ADR 0100): built here so the parity tests run
      # with it present. Rust is preinstalled on the runner.
      - name: Install the fast parser
        run: pip install ./rust/ffast-xyz

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q -m "not integration"

  headless:
    name: base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # A base install must run the server and the CLI. If anything in the
      # server import closure grows an optional dependency, these break.
      - name: Install FFAST without extras
        run: pip install -e ".[dev]"

      - name: Server and CLI must import and run
        run: |
          python -c "import server, ffast.core.environment"
          ffast-cli metrics validate
          ffast-cli metrics test

      - name: Core boundary tests
        run: pytest -q tests/ffast/test_ffast_core_boundary.py
